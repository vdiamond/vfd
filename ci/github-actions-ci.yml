name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vfd.slnx

      - name: Build
        run: dotnet build Vfd.slnx -c Release --no-restore

      - name: Test
        run: |
          $tests = Get-ChildItem -Recurse -Filter '*.Tests.csproj' -ErrorAction SilentlyContinue
          if ($tests) {
            dotnet test Vfd.slnx -c Release --no-build --verbosity normal
          } else {
            Write-Host "No test projects found; skipping tests."
          }

      - name: Publish
        run: dotnet publish Vfd.Web/Vfd.Web.csproj -c Release -o ./publish --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: vfd-web-publish
          path: ./publish
          if-no-files-found: error
